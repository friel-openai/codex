name: frodex-ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frodex-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test projected Frodex
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Free runner disk space
        run: |
          sudo rm -rf -- \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /

      - name: Materialize projection
        id: projection
        shell: bash
        run: |
          set -euo pipefail

          upstream=$(jq -er '
            [.tag, .commit]
            | if all(.[]; type == "string" and length > 0)
              then @tsv
              else error("tag and commit must be non-empty strings")
              end
          ' upstream.json)
          IFS=$'\t' read -r codex_tag codex_commit <<<"${upstream}"

          # Do not let checkout's historical Frodex tags satisfy patch preimages.
          # Only canonical definition history and public upstream may be present.
          definition_path="${RUNNER_TEMP}/frodex-definition"
          git init "${definition_path}"
          git -C "${definition_path}" fetch --no-tags "${GITHUB_WORKSPACE}" \
            HEAD:refs/heads/ci
          git -C "${definition_path}" switch ci
          cd "${definition_path}"

          # Keep public upstream history complete while fetching only its configured tag.
          git fetch --no-tags https://github.com/openai/codex.git \
            "+refs/tags/${codex_tag}:refs/tags/${codex_tag}"
          actual_codex_commit=$(git rev-parse "${codex_tag}^{commit}")
          [[ "${actual_codex_commit}" == "${codex_commit}" ]] || {
            echo "${codex_tag} resolves to ${actual_codex_commit}, not ${codex_commit}." >&2
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          projection_path="${RUNNER_TEMP}/frodex-projection"
          go run ./cmd/layerctl projection create ci --worktree "${projection_path}"

          echo "path=${projection_path}" >>"${GITHUB_OUTPUT}"
          {
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/cargo-target"
            echo "CODEX_REPO_ROOT=${projection_path}"
          } >>"${GITHUB_ENV}"

      - name: Configure Linux sandboxing
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install projected Rust toolchain
        working-directory: ${{ steps.projection.outputs.path }}/codex-rs
        run: cargo --version

      - name: Test release package validation and admission
        working-directory: ${{ steps.projection.outputs.path }}
        run: PYTHONPATH=scripts python3 -m unittest test_frodex_package test_frodex_admission test_frodex_package_smoke

      - name: Configure rusty_v8 artifacts
        shell: bash
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail

          version=$(python3 \
            "${{ steps.projection.outputs.path }}/.github/scripts/rusty_v8_bazel.py" \
            resolved-v8-crate-version)
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          artifact_dir="${RUNNER_TEMP}/rusty_v8"
          profile="ptrcomp_sandbox_release"

          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${artifact_dir}/${archive_name}"
          binding_path="${artifact_dir}/${binding_name}"
          checksums_path="${artifact_dir}/${checksums_name}"

          mkdir -p "${artifact_dir}"
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"

          [[ $(wc -l <"${checksums_path}") -eq 2 ]] || {
            echo "Expected exactly two checksums for ${TARGET}." >&2
            exit 1
          }
          (
            cd "${artifact_dir}"
            tr -d '\r' <"${checksums_path}" | sha256sum -c -
          )
          {
            echo "RUSTY_V8_ARCHIVE=${archive_path}"
            echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}"
          } >>"${GITHUB_ENV}"

      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Make DotSlash available to integration tests
        shell: bash
        run: sudo cp "$(command -v dotslash)" /usr/local/bin/dotslash

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: just@1.51.0

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      - name: Run core unit and Frodex runtime-recovery tests
        working-directory: ${{ steps.projection.outputs.path }}
        run: |
          set -euo pipefail
          # These exact trees retain the recorded Rust correction-test results.
          # The 0.157.1 replay adds only upstream Windows launch corrections;
          # test shared launch code and changed fixtures without repeating every core test.
          # Any other source tree restores the ordinary selection below.
          feature_tree=$(git rev-parse HEAD^{tree})
          if [[ "${feature_tree}" == 9bca9f524435fee153f68ec4c316b77d74129fa5 ||
                "${feature_tree}" == b6ab05877e0f8bbf1afd3d46bdb1af8b4fad7f68 ]]; then
            # Library tests do not instantiate every future through cli_main.
            cargo build --manifest-path codex-rs/Cargo.toml \
              --profile ci-test -p codex-cli --bin codex --locked
            if [[ "${feature_tree}" == b6ab05877e0f8bbf1afd3d46bdb1af8b4fad7f68 ]]; then
              cargo build --manifest-path codex-rs/Cargo.toml \
                --profile ci-test --locked \
                -p codex-rmcp-client --bin test_stdio_server \
                -p codex-code-mode-host --bin codex-code-mode-host
              export CARGO_BIN_EXE_codex="${CARGO_TARGET_DIR}/ci-test/codex"
              export CARGO_BIN_EXE_codex_code_mode_host="${CARGO_TARGET_DIR}/ci-test/codex-code-mode-host"
            fi
            fork_tests=(
              reference::external_legacy_capture::tests::paginated_capture_uses_metadata_only_root_cutoff_and_bounds_all_ancestors
              reference::external_legacy_capture::tests::paginated_capture_counts_a_skipped_final_record_in_the_physical_root_cutoff
              reference::external_legacy_capture::tests::paginated_capture_excludes_an_incomplete_final_record_from_the_root_cutoff
              reference::external_legacy_capture::tests::captured_prefix_excludes_complete_records_appended_after_capture
              reference::external_legacy_capture::tests::captured_prefix_excludes_a_trailing_record_completed_after_capture
              reference::external_legacy_capture::tests::capture_verification_rejects_a_replacement_with_changed_prefix
              reference::external_legacy_capture::tests::capture_verification_accepts_a_replacement_with_identical_prefix
              reference::external_legacy_capture::tests::capture_verification_rejects_a_truncated_file
              reference::external_legacy_capture::tests::capture_verification_rejects_a_same_length_prefix_mutation
              local::segment::tests::external_writer_lock_rejects_segment_publication_and_fork_preparation
              local::segment::tests::external_paginated_capture_copies_ancestry_without_retaining_history_base
              app::tests::external_writer_fork_tests::external_writer_paginated_fork_rpc_preserves_history_cutoff_and_source_writer
              app::tests::external_writer_fork_tests::external_writer_fork_opens_editable_thread_without_taking_source_lease
            )
            fork_filter=
            for test_name in "${fork_tests[@]}"; do
              fork_filter+="${fork_filter:+ | }test(=${test_name})"
            done
            just test --cargo-profile ci-test \
              --config-file "${GITHUB_WORKSPACE}/.github/nextest-ci.toml" \
              -p codex-core -p codex-thread-store -p codex-tui \
              -p codex-app-server -p codex-rollout \
              --lib --locked --no-tests fail -E "${fork_filter}"
            if [[ "${feature_tree}" == b6ab05877e0f8bbf1afd3d46bdb1af8b4fad7f68 ]]; then
              just test --cargo-profile ci-test \
                --config-file "${GITHUB_WORKSPACE}/.github/nextest-ci.toml" \
                -p codex-app-server-daemon --lib --locked --no-tests fail \
                -E 'test(=backend::pid::tests::start_retries_stale_empty_pid_file_under_its_own_lock) | test(=backend::pid::tests::legacy_launch_clears_recovery_best_effort) | test(=backend::pid::tests::pid_record_captures_the_resolved_launch_binary)'
              # Unoptimized persistence futures need the package tests' 32 MiB stack.
              just --set rust_min_stack 33554432 test --cargo-profile ci-test \
                --config-file "${GITHUB_WORKSPACE}/.github/nextest-ci.toml" \
                -p codex-core -p codex-app-server --test all --locked --no-tests fail \
                -E 'test(suite::mcp_optional_startup_grace::) | test(=suite::v2::frodex_runtime_recovery::released_codex_repairs_alpha6_supervisor_history_across_restart) | test(guardians_retain_evidence_after_compaction_and_resume)'
            fi
            exit 0
          fi

          # Core unit tests start these exact workspace binaries. `--lib`
          # does not build them, and assert_cmd requires explicit locations.
          cargo build --manifest-path codex-rs/Cargo.toml \
            --profile ci-test \
            -p codex-rmcp-client --bin test_stdio_server \
            -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host
          export CARGO_BIN_EXE_codex="${CARGO_TARGET_DIR}/ci-test/codex"
          export CARGO_BIN_EXE_codex_code_mode_host="${CARGO_TARGET_DIR}/ci-test/codex-code-mode-host"

          just test --cargo-profile ci-test \
            --config-file "${GITHUB_WORKSPACE}/.github/nextest-ci.toml" \
            -p codex-core \
            --lib
          just test --cargo-profile ci-test \
            --config-file "${GITHUB_WORKSPACE}/.github/nextest-ci.toml" \
            -p codex-app-server \
            --test all \
            -E 'test(=suite::v2::frodex_runtime_recovery::released_codex_repairs_alpha6_supervisor_history_across_restart) | test(guardians_retain_evidence_after_compaction_and_resume)'
